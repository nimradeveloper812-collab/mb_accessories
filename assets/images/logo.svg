<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 80" fill="none">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="60%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FACC15" />
      <stop offset="100%" stop-color="#F97316" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Icon Symbol: Modern Stylized Phone / Hexagon / Fast Bolt -->
  <g transform="translate(10, 10)">
    <rect x="0" y="0" width="60" height="60" rx="16" fill="#0F172A" stroke="url(#primaryGrad)" stroke-width="2.5" />
    <rect x="4" y="4" width="52" height="52" rx="12" fill="#1E293B" opacity="0.6" />
    
    <!-- Phone Contour -->
    <rect x="18" y="12" width="24" height="36" rx="4" stroke="#94A3B8" stroke-width="1.8" />
    
    <!-- Lightning Bolt -->
    <path d="M31 16 L23 31 L29 31 L27 44 L37 29 L31 29 Z" fill="url(#boltGrad)" filter="url(#glow)" />
    
    <!-- Signal Dot -->
    <circle cx="30" cy="14" r="1.5" fill="#38BDF8" />
  </g>

  <!-- Typography: MB ACCESSORIES -->
  <g transform="translate(82, 46)">
    <text x="0" y="0" font-family="'Outfit', 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="24" fill="#0F172A" letter-spacing="0.5">
      MB <tspan fill="url(#primaryGrad)">ACCESSORIES</tspan>
    </text>
    
    <!-- Subtitle: MUHAMMAD BASIL • GUJRANWALA -->
    <text x="1" y="18" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="9" fill="#64748B" letter-spacing="1.5">
      MUHAMMAD BASIL &#x2022; GUJRANWALA
    </text>
  </g>
</svg>
